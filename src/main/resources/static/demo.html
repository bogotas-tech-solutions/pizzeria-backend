<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardápio</title>
<!--
  DEMO TEMPORAL — servida por Spring Boot en http://localhost:8080/demo.html
  El front real vivirá en el repositorio pizzeria-frontend (React + Vite).
  Borrar este archivo cuando el front real esté listo.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Identidad tomada de la fachada de Dejoma */
    --black: #000000;
    --oven: #1c1514;
    --oven-line: #34292a;
    --sauce: #c8161d;          /* rojo del letrero */
    --sauce-deep: #9e0f15;
    --mozzarella: #fff3d6;     /* crema de las letras */
    --mustard: #f5c400;        /* franja amarilla */
    --wine: #7c1322;           /* texto sobre la franja */
    --flour: #a89c90;
    --display: "Alfa Slab One", "Rockwell", Georgia, serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-padding-top: calc(var(--safe-top) + 64px); }
  body {
    background: var(--black);
    color: var(--mozzarella);
    font: 400 16px/1.5 var(--body);
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 560px; margin: 0 auto; padding: 0 20px calc(120px + var(--safe-bottom)); }

  /* ---------- Encabezado: el letrero de la fachada ---------- */
  .sign { background: var(--sauce); padding-top: var(--safe-top); }
  .sign-inner {
    max-width: 560px; margin: 0 auto; padding: 18px 20px 22px; position: relative;
    background: radial-gradient(120% 90% at 50% 100%, rgba(255, 196, 120, 0.22), transparent 60%);
  }
  .sign-top { display: flex; justify-content: space-between; align-items: center; }
  .sign-small {
    font: 800 clamp(0.95rem, 4.4vw, 1.2rem)/1 var(--body);
    letter-spacing: 0.42em; color: var(--mozzarella); text-transform: uppercase;
    text-shadow: 0 0 14px rgba(255, 220, 160, 0.45);
  }
  .brand {
    font: 400 clamp(3rem, 15.5vw, 4.8rem)/0.95 var(--display);
    color: var(--mozzarella); margin-top: 10px; letter-spacing: 0.02em; text-transform: uppercase;
    text-shadow: 0 2px 0 #c9a77a, 0 0 22px rgba(255, 214, 150, 0.55);
    overflow-wrap: anywhere;
  }
  .band { background: var(--mustard); color: var(--wine); }
  .band-inner {
    max-width: 560px; margin: 0 auto; padding: 9px 20px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    font: 800 15px var(--body);
  }
  .band a { color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 7px; }
  .band a:hover { text-decoration: underline; }
  .band svg { width: 18px; height: 18px; flex-shrink: 0; }
  .band:empty, .band-inner:empty { display: none; }
  .lang { display: flex; border: 1px solid rgba(255, 243, 214, 0.45); border-radius: 999px; padding: 3px; flex-shrink: 0; }
  .lang button {
    background: none; border: 0; color: var(--mozzarella); font: 700 13px var(--body);
    padding: 5px 11px; border-radius: 999px; cursor: pointer; opacity: 0.85;
  }
  .lang button[aria-pressed="true"] { background: var(--mozzarella); color: var(--sauce); opacity: 1; }

  /* ---------- Pestañas de categorías ---------- */
  nav {
    position: sticky; top: 0; z-index: 5;
    background: var(--black);
    padding: 10px 0;
    margin: 0 -20px; padding-left: 20px; padding-right: 20px;
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    border-bottom: 1px solid var(--oven-line);
  }
  nav::-webkit-scrollbar { display: none; }
  nav a {
    flex-shrink: 0; color: var(--flour); text-decoration: none;
    font: 600 15px var(--body); padding: 8px 2px; margin-right: 14px;
    border-bottom: 2px solid transparent;
  }
  nav a:hover, nav a:focus-visible { color: var(--mozzarella); border-bottom-color: var(--mustard); }

  /* ---------- Menú ---------- */
  section { padding-top: 36px; }
  h2 {
    font: 400 2rem/1 var(--display);
    color: var(--mustard); margin-bottom: 8px; letter-spacing: 0.01em;
  }
  .product { padding: 18px 0; border-bottom: 1px solid var(--oven-line); }
  .product-head { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
  .product h3 { font: 600 1.125rem/1.3 var(--body); }
  .from { font-size: 0.8rem; color: var(--flour); white-space: nowrap; }
  .from strong { font: 800 1.2rem var(--body); color: var(--mozzarella); margin-left: 4px; }
  .desc { color: var(--flour); font-size: 0.925rem; margin-top: 4px; max-width: 46ch; }
  .sizes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .size {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--oven); color: var(--mozzarella);
    border: 1px solid var(--oven-line); border-radius: 10px;
    padding: 9px 12px; font: 500 14px var(--body); cursor: pointer;
  }
  .size:hover { border-color: var(--sauce); }
  .size .plus { color: var(--mustard); font-weight: 800; font-size: 17px; line-height: 1; }
  .size:focus-visible, .lang button:focus-visible, .btn:focus-visible, .band a:focus-visible { outline: 2px solid var(--mustard); outline-offset: 2px; }
  .product.sold-out h3, .product.sold-out .from strong { color: var(--flour); }
  .product.sold-out .size { cursor: not-allowed; opacity: 0.45; }
  .badge {
    display: inline-block; margin-left: 8px; vertical-align: 2px;
    font: 600 11px var(--body); color: var(--black); background: var(--flour);
    padding: 2px 7px; border-radius: 4px;
  }

  .status { padding: 64px 0; color: var(--flour); text-align: center; }
  .status strong { display: block; color: var(--mozzarella); font-size: 1.1rem; margin-bottom: 6px; }

  /* ---------- Barra del carrito ---------- */
  .cart-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    padding: 12px 20px calc(12px + var(--safe-bottom));
    background: linear-gradient(transparent, var(--black) 30%);
    display: none;
  }
  .cart-bar.visible { display: block; }
  .btn {
    width: 100%; max-width: 520px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;
    background: var(--sauce); color: var(--mozzarella); border: 0; border-radius: 14px;
    padding: 16px 20px; font: 600 16px var(--body); cursor: pointer;
  }
  .btn:hover { background: var(--sauce-deep); }
  .count { background: var(--mustard); color: var(--wine); border-radius: 999px; min-width: 26px; height: 26px; display: inline-grid; place-items: center; font-size: 14px; margin-right: 10px; }

  /* ---------- Hoja del carrito ---------- */
  dialog {
    margin: auto auto 0; width: 100%; max-width: 560px; max-height: 85vh;
    background: var(--oven); color: var(--mozzarella); border: 0;
    border-radius: 20px 20px 0 0; padding: 24px 20px calc(20px + var(--safe-bottom));
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.7); }
  dialog[open] { animation: rise 0.22s ease-out; }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .sheet-head h2 { color: var(--mozzarella); margin: 0; font-size: 1.7rem; }
  .close { background: none; border: 0; color: var(--flour); font: 500 15px var(--body); cursor: pointer; padding: 6px; }
  .line { display: flex; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--oven-line); }
  .line small { color: var(--flour); display: block; }
  .qty { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .qty button {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--oven-line);
    background: var(--black); color: var(--mozzarella); font-size: 17px; cursor: pointer;
  }
  .total { display: flex; justify-content: space-between; padding: 18px 0; font-weight: 600; font-size: 1.1rem; }
  .total strong { font: 400 1.6rem var(--display); }

  .notice { color: var(--flour); font-size: 13px; padding: 14px 0 4px; }
  .product.featured { border-left: 3px solid var(--mustard); padding-left: 14px; margin-left: -17px; }
  .star {
    display: inline-block; background: var(--mustard); color: var(--wine);
    font: 800 12px var(--body); padding: 2px 8px; border-radius: 4px; margin-bottom: 8px;
  }
  .opts-hint { color: var(--flour); font-size: 0.85rem; margin-top: 8px; }
  .sheet-sub { color: var(--flour); margin: -6px 0 10px; }
  .check {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 14px 0; border-bottom: 1px solid var(--oven-line); cursor: pointer;
  }
  .check input { width: 22px; height: 22px; accent-color: var(--mustard); }
  .check span small { color: var(--flour); margin-left: 6px; }
  #optSheet .btn { margin-top: 20px; }
  @media (max-width: 600px) { .product.featured { margin-left: -20px; padding-left: 17px; } }
  @media (prefers-reduced-motion: reduce) { dialog[open] { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="sign">
    <div class="sign-inner">
      <div class="sign-top">
        <span class="sign-small" id="brandSmall"></span>
        <div class="lang" role="group" aria-label="Idioma">
          <button type="button" data-lang="pt-BR">PT</button>
          <button type="button" data-lang="es">ES</button>
        </div>
      </div>
      <h1 class="brand" id="brand">&nbsp;</h1>
    </div>
  </div>
  <div class="band"><div class="band-inner" id="band"></div></div>
</header>
<div class="page">
  <p class="notice" id="notice"></p>
  <nav id="tabs" aria-label="Categorias"></nav>
  <p class="status" id="status" role="status"></p>
  <main id="menu"></main>
</div>

<div class="cart-bar" id="cartBar">
  <button class="btn" type="button" id="openCart">
    <span><span class="count" id="count">0</span><span id="seeOrder"></span></span>
    <span id="barTotal"></span>
  </button>
</div>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <h2 id="sheetTitle"></h2>
    <button class="close" type="button" id="closeCart"></button>
  </div>
  <div id="lines"></div>
  <div class="total"><span id="totalLabel"></span><strong id="sheetTotal"></strong></div>
  <button class="btn" type="button" id="sendOrder"><span id="sendLabel"></span><span>↗</span></button>
</dialog>

<dialog id="optSheet" aria-labelledby="optTitle">
  <div class="sheet-head">
    <h2 id="optTitle"></h2>
    <button class="close" type="button" id="closeOpt"></button>
  </div>
  <p class="sheet-sub" id="optSub"></p>
  <div id="optList"></div>
  <button class="btn" type="button" id="confirmOpt"><span id="confirmLabel"></span><span id="confirmPrice"></span></button>
</dialog>

<script>
  // ---------- Textos de la interfaz (los del menú vienen traducidos desde la API) ----------
  const UI = {
    "pt-BR": {
      from: "a partir de", soldOut: "Esgotado", seeOrder: "Ver pedido", yourOrder: "Seu pedido",
      close: "Fechar", total: "Total", send: "Enviar pedido pelo WhatsApp", loading: "Carregando cardápio…",
      errorTitle: "Não foi possível carregar o cardápio.", errorHint: "Verifique se o backend está rodando.",
      greeting: "Olá! Gostaria de fazer um pedido:", add: "Adicionar",
      featured: "★ Exclusividade da casa", customize: "Personalize sua pizza", free: "grátis",
      addToOrder: "Adicionar ao pedido", canCustomize: "Você pode escolher:",
      notice: "Versão de demonstração. Preços e tamanhos ilustrativos."
    },
    es: {
      from: "desde", soldOut: "Agotado", seeOrder: "Ver pedido", yourOrder: "Tu pedido",
      close: "Cerrar", total: "Total", send: "Enviar pedido por WhatsApp", loading: "Cargando menú…",
      errorTitle: "No se pudo cargar el menú.", errorHint: "Verifica que el backend esté corriendo.",
      greeting: "¡Hola! Quisiera hacer un pedido:", add: "Agregar",
      featured: "★ Especialidad de la casa", customize: "Personaliza tu pizza", free: "gratis",
      addToOrder: "Agregar al pedido", canCustomize: "Puedes elegir:",
      notice: "Versión de demostración. Precios y tamaños ilustrativos."
    }
  };

  const slug = new URLSearchParams(location.search).get("r") || "dejoma-pizzaria";

  // Identidad visual por restaurante. SOLO PARA LA DEMO: en el producto real
  // estos datos vendrán de la API (tabla restaurant), no escritos en el front.
  const BRANDING = {
    "dejoma-pizzaria": { small: "Pizzaria", big: "Dejoma", instagram: "dejomapizzaria", phoneLabel: "99919-5338" }
  };
  const brand = BRANDING[slug];
  const ICONS = {
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>',
    whatsapp: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.2a9.8 9.8 0 0 0-8.4 14.9L2.3 21.8l4.8-1.3A9.8 9.8 0 1 0 12 2.2zm0 17.8a8 8 0 0 1-4.1-1.1l-.3-.2-2.9.8.8-2.8-.2-.3A8 8 0 1 1 12 20zm4.4-6c-.2-.1-1.4-.7-1.7-.8-.2-.1-.4-.1-.5.1l-.8.9c-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 0 0-.6.3 2.7 2.7 0 0 0-.9 2c0 1.2.9 2.3 1 2.5.1.2 1.7 2.6 4.2 3.7 1.6.7 2.2.7 3 .6.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1l-.5-.3z"/></svg>'
  };
  const brl = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
  const $ = (id) => document.getElementById(id);

  let lang = (navigator.language || "pt").toLowerCase().startsWith("es") ? "es" : "pt-BR";
  let catalog = null;
  let cart = loadCart();          // { "idVariante|idOpcion,idOpcion": cantidad }
  const variants = new Map();     // idVariante → { product, variant, category }
  const options = new Map();      // idOpcion → option
  let pendingVariant = null;      // variante esperando que elijan opciones

  function loadCart() {
    try { return JSON.parse(sessionStorage.getItem("cart:" + slug)) || {}; } catch { return {}; }
  }
  function saveCart() {
    try { sessionStorage.setItem("cart:" + slug, JSON.stringify(cart)); } catch { /* el carrito vive solo en memoria */ }
  }
  function esc(text) {
    const div = document.createElement("div");
    div.textContent = text ?? "";
    return div.innerHTML;
  }

  // Una línea del carrito = variante + opciones elegidas
  function parseKey(key) {
    const [variantId, opts = ""] = key.split("|");
    return { variantId, optionIds: opts ? opts.split(",") : [] };
  }
  function describe(key) {
    const { variantId, optionIds } = parseKey(key);
    const entry = variants.get(variantId);
    if (!entry || optionIds.some(id => !options.has(id))) return null;
    const chosen = optionIds.map(id => options.get(id));
    const unit = entry.variant.price + chosen.reduce((s, o) => s + o.price, 0);
    return { ...entry, chosen, unit };
  }

  async function load() {
    const t = UI[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
    $("notice").textContent = t.notice;
    const status = $("status");
    status.hidden = false;
    status.textContent = t.loading;
    try {
      const res = await fetch(`/api/v1/restaurants/${encodeURIComponent(slug)}/catalog?lang=${lang}`);
      if (!res.ok) throw new Error(res.status);
      catalog = await res.json();
      status.hidden = true;
      render();
    } catch (e) {
      $("tabs").innerHTML = "";
      $("menu").innerHTML = "";
      status.innerHTML = `<strong>${t.errorTitle}</strong>${t.errorHint}`;
    }
  }

  function render() {
    const t = UI[lang];
    $("brandSmall").textContent = brand ? brand.small : "";
    $("brand").textContent = brand ? brand.big : catalog.restaurant.name;
    document.title = catalog.restaurant.name;
    $("band").innerHTML = brand ? `
      <a href="https://instagram.com/${brand.instagram}" target="_blank" rel="noopener">${ICONS.instagram}${brand.instagram}</a>
      <span style="display:inline-flex;align-items:center;gap:7px">${ICONS.whatsapp}${brand.phoneLabel}</span>` : "";
    variants.clear();
    options.clear();

    $("tabs").innerHTML = catalog.categories
      .map(c => `<a href="#cat-${c.id}">${esc(c.name)}</a>`).join("");

    $("menu").innerHTML = catalog.categories.map(c => {
      c.options.forEach(o => options.set(String(o.id), o));
      const hint = c.options.length
        ? `<p class="opts-hint">${t.canCustomize} ${c.options.map(o => esc(o.name)).join(", ")}</p>` : "";
      return `
      <section id="cat-${c.id}">
        <h2>${esc(c.name)}</h2>
        ${c.products.map(p => {
          p.variants.forEach(v => variants.set(String(v.id), { product: p, variant: v, category: c }));
          const min = Math.min(...p.variants.map(v => v.price));
          const classes = ["product", p.available ? "" : "sold-out", p.featured ? "featured" : ""].join(" ").trim();
          return `
          <article class="${classes}">
            ${p.featured ? `<span class="star">${t.featured}</span>` : ""}
            <div class="product-head">
              <h3>${esc(p.name)}${p.available ? "" : `<span class="badge">${t.soldOut}</span>`}</h3>
              <span class="from">${p.variants.length > 1 ? t.from : ""}<strong>${brl.format(min)}</strong></span>
            </div>
            ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ""}
            <div class="sizes">
              ${p.variants.map(v => `
                <button class="size" type="button" data-variant="${v.id}" ${p.available ? "" : "disabled"}
                        aria-label="${t.add} ${esc(p.name)} ${esc(v.name)}">
                  ${esc(v.name)}${p.variants.length > 1 ? " · " + brl.format(v.price) : ""}<span class="plus" aria-hidden="true">+</span>
                </button>`).join("")}
            </div>
          </article>`;
        }).join("")}
        ${hint}
      </section>`;
    }).join("");

    // Quita del carrito lo que ya no existe en el menú
    Object.keys(cart).forEach(key => { if (!describe(key)) delete cart[key]; });
    renderCart();
  }

  function addToCart(variantId, optionIds) {
    // La clave siempre lleva "|": así JavaScript respeta el orden en que se agregaron los productos
    const key = `${variantId}|${[...optionIds].sort((a, b) => a - b).join(",")}`;
    cart[key] = (cart[key] || 0) + 1;
    renderCart();
  }

  // ---------- Hoja de opciones ----------
  function openOptions(variantId) {
    const t = UI[lang];
    const { product, variant, category } = variants.get(variantId);
    pendingVariant = variantId;
    $("optTitle").textContent = t.customize;
    $("optSub").textContent = `${product.name} · ${variant.name}`;
    $("closeOpt").textContent = t.close;
    $("confirmLabel").textContent = t.addToOrder;
    $("optList").innerHTML = category.options.map(o => `
      <label class="check">
        <span>${esc(o.name)}<small>${o.price > 0 ? "+ " + brl.format(o.price) : t.free}</small></span>
        <input type="checkbox" value="${o.id}">
      </label>`).join("");
    updateOptionPrice();
    $("optSheet").showModal();
  }
  function chosenOptions() {
    return [...$("optList").querySelectorAll("input:checked")].map(i => i.value);
  }
  function updateOptionPrice() {
    const base = variants.get(pendingVariant).variant.price;
    const extra = chosenOptions().reduce((s, id) => s + options.get(id).price, 0);
    $("confirmPrice").textContent = brl.format(base + extra);
  }

  // ---------- Carrito ----------
  function renderCart() {
    const t = UI[lang];
    const lines = Object.entries(cart).filter(([, q]) => q > 0).map(([key, q]) => ({ key, q, ...describe(key) }));
    const count = lines.reduce((s, l) => s + l.q, 0);
    const total = lines.reduce((s, l) => s + l.unit * l.q, 0);

    $("cartBar").classList.toggle("visible", count > 0);
    $("count").textContent = count;
    $("seeOrder").textContent = t.seeOrder;
    $("barTotal").textContent = brl.format(total);
    $("sheetTitle").textContent = t.yourOrder;
    $("closeCart").textContent = t.close;
    $("totalLabel").textContent = t.total;
    $("sheetTotal").textContent = brl.format(total);
    $("sendLabel").textContent = t.send;

    $("lines").innerHTML = lines.map(l => {
      const detail = [l.variant.name, ...l.chosen.map(o => o.name)].map(esc).join(", ");
      return `
        <div class="line">
          <div>${esc(l.product.name)}<small>${detail} · ${brl.format(l.unit * l.q)}</small></div>
          <div class="qty">
            <button type="button" data-dec="${l.key}" aria-label="−">−</button>
            <span>${l.q}</span>
            <button type="button" data-inc="${l.key}" aria-label="+">+</button>
          </div>
        </div>`;
    }).join("");
    if (count === 0 && $("sheet").open) $("sheet").close();
    saveCart();
  }

  function whatsappLink() {
    const t = UI[lang];
    let total = 0;
    const lines = Object.entries(cart).filter(([, q]) => q > 0).map(([key, q]) => {
      const l = describe(key);
      total += l.unit * q;
      const extras = l.chosen.length ? ` + ${l.chosen.map(o => o.name).join(", ")}` : "";
      return `${q}x ${l.product.name} (${l.variant.name})${extras} — ${brl.format(l.unit * q)}`;
    });
    const text = [t.greeting, "", ...lines, "", `${t.total}: ${brl.format(total)}`].join("\n");
    return `https://wa.me/${catalog.restaurant.whatsappPhone}?text=${encodeURIComponent(text)}`;
  }

  // ---------- Eventos ----------
  document.addEventListener("click", (e) => {
    const size = e.target.closest("[data-variant]");
    if (size) {
      const id = size.dataset.variant;
      if (variants.get(id).category.options.length) openOptions(id); else addToCart(id, []);
      return;
    }
    const inc = e.target.closest("[data-inc]");
    if (inc) { cart[inc.dataset.inc]++; renderCart(); return; }
    const dec = e.target.closest("[data-dec]");
    if (dec) { const k = dec.dataset.dec; cart[k]--; if (cart[k] <= 0) delete cart[k]; renderCart(); return; }
    const langBtn = e.target.closest("[data-lang]");
    if (langBtn && langBtn.dataset.lang !== lang) { lang = langBtn.dataset.lang; load(); }
  });
  $("optList").addEventListener("change", updateOptionPrice);
  $("confirmOpt").addEventListener("click", () => { addToCart(pendingVariant, chosenOptions()); $("optSheet").close(); });
  $("closeOpt").addEventListener("click", () => $("optSheet").close());
  $("openCart").addEventListener("click", () => $("sheet").showModal());
  $("closeCart").addEventListener("click", () => $("sheet").close());
  $("sendOrder").addEventListener("click", () => window.open(whatsappLink(), "_blank", "noopener"));

  load();
</script>
</body>
</html>
