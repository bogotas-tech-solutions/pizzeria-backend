spring.application.name=pizzeria-backend

# Lee las variables del archivo .env (en la raíz del proyecto)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Hibernate nunca crea ni modifica tablas: eso lo hace Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Agrupa las consultas de colecciones para evitar el problema N+1
spring.jpa.properties.hibernate.default_batch_fetch_size=50
